<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Learn to Read Academy</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon-64.png" type="image/png">
  <link rel="preload" href="/assets/fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/instrument-serif-latin-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <script>
    /* Hide the big headline for a moment until its fonts are ready, so it doesn't jump (max 1.2s). */
    (function () {
      var d = document.documentElement;
      if (!document.fonts || !document.fonts.load) return;
      d.classList.add("fonts-loading");
      var done = function () { d.classList.remove("fonts-loading"); };
      Promise.all([document.fonts.load('600 40px "Lexend"'), document.fonts.load('italic 400 40px "Instrument Serif"')]).then(done, done);
      setTimeout(done, 1200);
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="contact-hero" style="min-height:80vh;display:grid;place-items:center">
    <div class="wrap">
      <img src="/assets/img/logo.webp" alt="Learn to Read Academy" width="120" height="120" style="margin:0 auto 24px;border-radius:50%">
      <h1>Oops! <em>Page not found</em></h1>
      <p>Let's get you back.</p>
      <p style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px">
        <a class="btn btn-primary" href="/">Home</a>
        <a class="btn btn-light" href="https://learntoreadacademy.thinkific.com/courses/take/learntoread">Log in</a>
      </p>
    </div>
  </main>
</body>
</html>
